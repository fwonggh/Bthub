<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>飞鱼磁力最新网址获取</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f8fa;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #57606a;
      --border: #d0d7de;
      --primary: #0969da;
      --primary-hover: #0550ae;
      --success: #1a7f37;
      --danger: #cf222e;
      --warn-bg: #fff8c5;
      --warn-border: #d4a72c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --card: #161b22;
        --text: #e6edf3;
        --muted: #8b949e;
        --border: #30363d;
        --primary: #2f81f7;
        --primary-hover: #1f6feb;
        --success: #3fb950;
        --danger: #f85149;
        --warn-bg: rgba(187, 128, 9, 0.16);
        --warn-border: #9e6a03;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }
    .head-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    h1 { margin: 0; font-size: 20px; }
    .ver { font-size: 12px; color: var(--muted); }
    .desc {
      margin: 0 0 18px;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
    }
    .update-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 8px;
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .update-banner.show { display: flex; }
    .banner-btns {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .status {
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 14px;
      margin-bottom: 16px;
      word-break: break-all;
    }
    .status.ok { border-color: var(--success); color: var(--success); }
    .status.err { border-color: var(--danger); color: var(--danger); }
    .url-box {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .url-input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 14px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }
    button, a.btn {
      appearance: none;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }
    .btn-sm { padding: 6px 10px; font-size: 12px; }
    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .mirrors {
      border-top: 1px solid var(--border);
      padding-top: 14px;
      font-size: 13px;
      color: var(--muted);
    }
    .mirrors-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }
    .mirrors-list a {
      font-size: 13px;
      color: var(--primary);
      text-decoration: none;
    }
    .mirrors-list a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="card">
    <div class="head-row">
      <h1>最新网址获取器</h1>
      <span id="verLabel" class="ver"></span>
    </div>

    <div id="updateBanner" class="update-banner" role="alert">
      <span id="updateText">发现新版本</span>
      <div class="banner-btns">
        <button id="confirmUpdateBtn" class="btn btn-primary btn-sm" type="button">确定下载</button>
        <button id="dismissUpdateBtn" class="btn btn-sm" type="button">暂不更新</button>
      </div>
    </div>

    <div id="statusBox" class="status">正在检查更新并获取最新网址…</div>

    <div class="url-box">
      <input id="latestUrlInput" class="url-input" type="text" readonly placeholder="等待获取最新网址..." />
      <button id="copyBtn" type="button">复制</button>
    </div>

    <div class="actions">
      <a id="openBtn" class="btn btn-primary" href="#" target="_blank" rel="noopener noreferrer">立即打开最新网址</a>
      <button id="retryBtn" type="button">重新检测</button>
      <label style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;">
        <input id="autoJumpChk" type="checkbox" checked />
        获取到后自动打开网址
      </label>
    </div>

    <div class="mirrors">
      <div>若自动获取受限，可直接打开以下发布页或备用域名：</div>
      <div id="mirrorsList" class="mirrors-list"></div>
    </div>
  </main>

  <script>
    // 每次发布新版本 HTML 时，修改此版本号
    const TOOL_VERSION = "2026.11.25.1";

    // 最新网址发布文件路径（github.io / pages.dev）
    const SOURCES = [
      "https://fwonggh.github.io/Bthub/latest-url.txt",
      "https://bt-redirect.pages.dev/latest-url.txt"
    ];

    // 本 HTML 工具自身的远程托管地址（用于检查新版本与一键下载）
    const TOOL_SOURCES = [
      "https://fwonggh.github.io/Bthub/latest-url.html",
      "https://bt-redirect.pages.dev/latest-url.html"
    ];

    // 兜底备用入口
    const FALLBACK_URLS = [
      "https://fycl.link",
      "https://fycl.work"
    ];

    const verLabel = document.getElementById("verLabel");
    const updateBanner = document.getElementById("updateBanner");
    const updateText = document.getElementById("updateText");
    const confirmUpdateBtn = document.getElementById("confirmUpdateBtn");
    const dismissUpdateBtn = document.getElementById("dismissUpdateBtn");
    const statusBox = document.getElementById("statusBox");
    const latestUrlInput = document.getElementById("latestUrlInput");
    const openBtn = document.getElementById("openBtn");
    const copyBtn = document.getElementById("copyBtn");
    const retryBtn = document.getElementById("retryBtn");
    const autoJumpChk = document.getElementById("autoJumpChk");
    const mirrorsList = document.getElementById("mirrorsList");

    verLabel.textContent = "v" + TOOL_VERSION;
    let latestHtmlCache = "";
    let latestRemoteVersion = "";
    let hasPendingUpdate = false;

    function renderMirrors() {
      mirrorsList.innerHTML = FALLBACK_URLS.map((u) => {
        const safe = u.replace(/"/g, "&quot;");
        return `<a href="${safe}" target="_blank" rel="noopener noreferrer">${safe}</a>`;
      }).join("");
    }

    function pickRandomItem(arr) {
      if (!Array.isArray(arr) || !arr.length) return "";
      if (arr.length === 1) return arr[0];
      if (window.crypto && typeof window.crypto.getRandomValues === "function") {
        const buf = new Uint32Array(1);
        const limit = Math.floor(0x100000000 / arr.length) * arr.length;
        let n = 0;
        do {
          window.crypto.getRandomValues(buf);
          n = buf[0];
        } while (n >= limit);
        return arr[n % arr.length];
      }
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function shuffleArray(arr) {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        let j = 0;
        if (window.crypto && typeof window.crypto.getRandomValues === "function") {
          const buf = new Uint32Array(1);
          const limit = Math.floor(0x100000000 / (i + 1)) * (i + 1);
          let n = 0;
          do {
            window.crypto.getRandomValues(buf);
            n = buf[0];
          } while (n >= limit);
          j = n % (i + 1);
        } else {
          j = Math.floor(Math.random() * (i + 1));
        }
        const tmp = copy[i];
        copy[i] = copy[j];
        copy[j] = tmp;
      }
      return copy;
    }

    function extractCandidateUrls(raw) {
      const s = String(raw || "").trim();
      if (!s) return [];
      const list = [];

      if (s.startsWith("{")) {
        try {
          const obj = JSON.parse(s);
          const items = Array.isArray(obj.urls)
            ? obj.urls
            : [obj.url || obj.latest_url || obj.domain || ""];
          for (const item of items) {
            const v = String(item || "").trim();
            if (v) list.push(/^https?:\/\//i.test(v) ? v : "https://" + v);
          }
        } catch (_) {}
      }

      const lines = s.split(/\r?\n/);
      for (const line of lines) {
        const clean = line.replace(/#.*$/, "").trim();
        if (!clean) continue;
        const m = clean.match(/https?:\/\/[^\s"'<>]+/i);
        if (m) {
          list.push(m[0].replace(/[.,;)]+$/, ""));
        } else if (/^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}(\/.*)?$/.test(clean)) {
          list.push("https://" + clean);
        }
      }

      const deduped = [];
      const seen = new Set();
      for (const u of list) {
        try {
          const norm = new URL(u).toString();
          if (!seen.has(norm)) {
            seen.add(norm);
            deduped.push(norm);
          }
        } catch (_) {}
      }
      return deduped;
    }

    function normalizeUrl(raw) {
      const pool = extractCandidateUrls(raw);
      if (!pool.length) return "";
      const shuffled = shuffleArray(pool);
      return shuffled[0];
    }

    function probeSingleUrl(url, timeoutMs = 2200) {
  return new Promise((resolve) => {
    let settled = false;
    const done = (val) => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      resolve(val);
    };
    const timer = setTimeout(() => done(null), timeoutMs);
    const t0 = performance.now();
    const sep = url.includes("?") ? "&" : "?";
    const probeUrl = `${url}${sep}_chk=${Date.now()}`;

    const requestWith = (method) => {
      const ctrl = new AbortController();
      const subTimer = setTimeout(() => ctrl.abort(), Math.max(600, timeoutMs - 200));
      return fetch(probeUrl, {
        method,
        mode: "no-cors",
        cache: "no-store",
        signal: ctrl.signal
      }).then(() => {
        clearTimeout(subTimer);
        done({ url, latency: Math.round(performance.now() - t0), method });
      }).catch((err) => {
        clearTimeout(subTimer);
        throw err;
      });
    };

    requestWith("HEAD").catch(() => {
      requestWith("GET").catch(() => done(null));
    });
  });
}

async function probeFastestUrl(urls, timeoutMs = 2200) {
  if (!Array.isArray(urls) || !urls.length) return null;
  const shuffled = shuffleArray(urls);
  const results = await Promise.all(shuffled.map((u) => probeSingleUrl(u, timeoutMs)));
  const alive = results.filter(Boolean).sort((a, b) => a.latency - b.latency);
  return alive.length ? alive[0] : null;
}
function parseVersionFromHtml(htmlText) {
      const m = String(htmlText || "").match(/const\s+TOOL_VERSION\s*=\s*["']([^"']+)["']/);
      return m ? m[1].trim() : "";
    }

    async function fetchTextWithTimeout(url, timeoutMs = 4500) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        const sep = url.includes("?") ? "&" : "?";
        const res = await fetch(`${url}${sep}_t=${Date.now()}`, {
          signal: ctrl.signal,
          cache: "no-store"
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        return await res.text();
      } finally {
        clearTimeout(timer);
      }
    }

    function triggerHtmlDownload(htmlText, versionTag) {
      if (!htmlText) return false;
      const blob = new Blob([htmlText], { type: "text/html;charset=utf-8" });
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = blobUrl;
      a.download = `飞鱼磁力最新网址${versionTag ? "_v" + versionTag : ""}.html`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(blobUrl), 2500);
      return true;
    }

    async function checkToolUpdate() {
      for (const src of TOOL_SOURCES) {
        try {
          const html = await fetchTextWithTimeout(src, 5000);
          const remoteVer = parseVersionFromHtml(html);
          if (remoteVer && remoteVer !== TOOL_VERSION && html.includes("<html")) {
            latestHtmlCache = html;
            latestRemoteVersion = remoteVer;
            hasPendingUpdate = true;
            autoJumpChk.checked = false;
            updateText.textContent = `发现新版本 v${remoteVer}（当前 v${TOOL_VERSION}），是否下载新版？`;
            updateBanner.classList.add("show");
            return true;
          }
        } catch (_) {}
      }
      hasPendingUpdate = false;
      return false;
    }

    async function resolveLatestUrl() {
  statusBox.className = "status";
  statusBox.textContent = "正在测速并筛选可用网址…";
  latestUrlInput.value = "";
  openBtn.setAttribute("href", "#");

  for (const src of SOURCES) {
    try {
      const text = await fetchTextWithTimeout(src, 4500);
      const candidates = extractCandidateUrls(text);
      if (!candidates.length) continue;

      const picked = await probeFastestUrl(candidates, 2200);
      if (!picked || !picked.url) continue;

      statusBox.className = "status ok";
      statusBox.textContent = `已选出最快可用网址（${picked.method} · 约 ${picked.latency} ms）`;
      latestUrlInput.value = picked.url;
      openBtn.setAttribute("href", picked.url);

      if (!hasPendingUpdate && autoJumpChk.checked) {
        setTimeout(() => {
          window.location.href = picked.url;
        }, 800);
      }
      return;
    } catch (_) {}
  }

  const fallbackPicked = await probeFastestUrl(FALLBACK_URLS, 2200);
  if (fallbackPicked && fallbackPicked.url) {
    statusBox.className = "status ok";
    statusBox.textContent = `已切换至最快备用网址（${fallbackPicked.method} · 约 ${fallbackPicked.latency} ms）`;
    latestUrlInput.value = fallbackPicked.url;
    openBtn.setAttribute("href", fallbackPicked.url);
    if (!hasPendingUpdate && autoJumpChk.checked) {
      setTimeout(() => {
        window.location.href = fallbackPicked.url;
      }, 800);
    }
    return;
  }

  statusBox.className = "status err";
  statusBox.textContent = "自动获取最新网址失败，请点击下方备用入口或重新检测。";
}
confirmUpdateBtn.addEventListener("click", async () => {
      confirmUpdateBtn.disabled = true;
      updateText.textContent = `正在下载新版本 v${latestRemoteVersion || "latest"}…`;

      let htmlToSave = latestHtmlCache;
      if (!htmlToSave) {
        for (const src of TOOL_SOURCES) {
          try {
            const h = await fetchTextWithTimeout(src, 5000);
            if (h && h.includes("<html")) {
              htmlToSave = h;
              break;
            }
          } catch (_) {}
        }
      }

      if (triggerHtmlDownload(htmlToSave, latestRemoteVersion)) {
        updateText.textContent = `已开始下载新版 v${latestRemoteVersion || "latest"}，请在浏览器下载列表中打开新文件。`;
      } else {
        updateText.textContent = "下载失败，请稍后再试。";
      }
      confirmUpdateBtn.disabled = false;
    });

    dismissUpdateBtn.addEventListener("click", () => {
      updateBanner.classList.remove("show");
      hasPendingUpdate = false;
    });

    copyBtn.addEventListener("click", async () => {
      const val = latestUrlInput.value.trim();
      if (!val) return;
      try {
        await navigator.clipboard.writeText(val);
        copyBtn.textContent = "已复制";
      } catch (_) {
        latestUrlInput.select();
        document.execCommand("copy");
        copyBtn.textContent = "已复制";
      }
      setTimeout(() => { copyBtn.textContent = "复制"; }, 1500);
    });

    retryBtn.addEventListener("click", async () => {
      await checkToolUpdate();
      await resolveLatestUrl();
    });

    renderMirrors();
    (async () => {
      await checkToolUpdate();
      await resolveLatestUrl();
    })();
  </script>
</body>
</html>
