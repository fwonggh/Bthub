<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>飞鱼磁力最新网址获取</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f8fa;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #57606a;
      --border: #d0d7de;
      --primary: #0969da;
      --primary-hover: #0550ae;
      --success: #1a7f37;
      --danger: #cf222e;
      --warn-bg: #fff8c5;
      --warn-border: #d4a72c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --card: #161b22;
        --text: #e6edf3;
        --muted: #8b949e;
        --border: #30363d;
        --primary: #2f81f7;
        --primary-hover: #1f6feb;
        --success: #3fb950;
        --danger: #f85149;
        --warn-bg: rgba(187, 128, 9, 0.16);
        --warn-border: #9e6a03;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }
    .head-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    h1 { margin: 0; font-size: 20px; }
    .ver { font-size: 12px; color: var(--muted); }
    .update-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 8px;
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .update-banner.show { display: flex; }
    .banner-btns {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .status {
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 14px;
      margin-bottom: 16px;
      word-break: break-all;
    }
    .status.ok { border-color: var(--success); color: var(--success); }
    .status.err { border-color: var(--danger); color: var(--danger); }
    .url-box {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .url-input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 14px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }
    button, a.btn {
      appearance: none;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-sm { padding: 6px 10px; font-size: 12px; }
    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .mirrors {
      border-top: 1px solid var(--border);
      padding-top: 14px;
      font-size: 13px;
      color: var(--muted);
    }
    .mirrors-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }
    .mirrors-list a {
      font-size: 13px;
      color: var(--primary);
      text-decoration: none;
    }
    .mirrors-list a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="card">
    <div class="head-row">
      <h1>最新网址获取器</h1>
      <span id="verLabel" class="ver"></span>
    </div>

    <div id="updateBanner" class="update-banner" role="alert">
      <span id="updateText">发现新版本</span>
      <div class="banner-btns">
        <button id="confirmUpdateBtn" class="btn btn-primary btn-sm" type="button">确定下载</button>
        <button id="dismissUpdateBtn" class="btn btn-sm" type="button">暂不更新</button>
      </div>
    </div>

    <div id="statusBox" class="status">正在检查更新并获取最新网址…</div>

    <div class="url-box">
      <input id="latestUrlInput" class="url-input" type="text" readonly placeholder="等待获取最新网址..." />
      <button id="copyBtn" type="button">复制</button>
    </div>

    <div class="actions">
      <a id="openBtn" class="btn btn-primary" href="#" target="_blank" rel="noopener noreferrer">立即打开最新网址</a>
      <button id="retryBtn" type="button">重新检测</button>
      <label style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;">
        <input id="autoJumpChk" type="checkbox" checked />
        获取到后自动打开网址
      </label>
    </div>

    <div class="mirrors">
      <div>若自动获取受限，可直接打开以下发布页或备用域名：</div>
      <div id="mirrorsList" class="mirrors-list"></div>
    </div>
  </main>

  <script>
    // 每次发布新版本 HTML 时，修改此版本号
    const TOOL_VERSION = "2026.11.26.3";

    // 最新网址发布文件路径（github.io / pages.dev）
    const SOURCES = [
      "https://fwonggh.github.io/Bthub/latest-url.txt",
      "https://bt-redirect.pages.dev/latest-url.txt"
    ];

    // 本 HTML 工具自身的远程托管地址（用于检查新版本与一键下载）
    const TOOL_SOURCES = [
      "https://fwonggh.github.io/Bthub/latest-url.html",
      "https://bt-redirect.pages.dev/latest-url.html"
    ];

    // 兜底备用入口
    const FALLBACK_URLS = [
      "https://fycl.link",
      "https://fycl.work"
    ];

    const FAST_URL_CACHE_KEY = "latest_url_picker_fast_cache";

    const verLabel = document.getElementById("verLabel");
    const updateBanner = document.getElementById("updateBanner");
    const updateText = document.getElementById("updateText");
    const confirmUpdateBtn = document.getElementById("confirmUpdateBtn");
    const dismissUpdateBtn = document.getElementById("dismissUpdateBtn");
    const statusBox = document.getElementById("statusBox");
    const latestUrlInput = document.getElementById("latestUrlInput");
    const openBtn = document.getElementById("openBtn");
    const copyBtn = document.getElementById("copyBtn");
    const retryBtn = document.getElementById("retryBtn");
    const autoJumpChk = document.getElementById("autoJumpChk");
    const mirrorsList = document.getElementById("mirrorsList");

    verLabel.textContent = "v" + TOOL_VERSION;

    let latestHtmlCache = "";
    let latestRemoteVersion = "";
    let hasPendingUpdate = false;
    let isRunning = false;
    let jumpTimer = null;
    let fetchSeq = 0;
    let remoteHtmlSeq = 0;

    function clearScheduledJump() {
      if (jumpTimer !== null) {
        clearTimeout(jumpTimer);
        jumpTimer = null;
      }
    }

    function escapeAttr(str) {
      return String(str || "").replace(/"/g, "&quot;");
    }

    function renderMirrors() {
      mirrorsList.innerHTML = FALLBACK_URLS.map((u) => {
        const safe = escapeAttr(u);
        return `<a href="${safe}" target="_blank" rel="noopener noreferrer">${safe}</a>`;
      }).join("");
    }

    function shuffleArray(arr) {
      const copy = Array.isArray(arr) ? arr.slice() : [];
      for (let i = copy.length - 1; i > 0; i--) {
        let j = 0;
        if (window.crypto && typeof window.crypto.getRandomValues === "function") {
          const buf = new Uint32Array(1);
          const limit = Math.floor(0x100000000 / (i + 1)) * (i + 1);
          let n = 0;
          do {
            window.crypto.getRandomValues(buf);
            n = buf[0];
          } while (n >= limit);
          j = n % (i + 1);
        } else {
          j = Math.floor(Math.random() * (i + 1));
        }
        const tmp = copy[i];
        copy[i] = copy[j];
        copy[j] = tmp;
      }
      return copy;
    }

    function extractCandidateUrls(raw) {
      const s = String(raw || "").trim();
      if (!s) return [];
      const list = [];

      if (s.startsWith("{")) {
        try {
          const obj = JSON.parse(s);
          const items = Array.isArray(obj.urls)
            ? obj.urls
            : [obj.url || obj.latest_url || obj.domain || ""];
          for (const item of items) {
            const v = String(item || "").trim();
            if (v) list.push(/^https?:\/\//i.test(v) ? v : "https://" + v);
          }
        } catch (_) {}
      }

      const lines = s.split(/\r?\n/);
      for (const line of lines) {
        const clean = line.replace(/#.*$/, "").trim();
        if (!clean) continue;
        const m = clean.match(/https?:\/\/[^\s"'<>]+/i);
        if (m) {
          list.push(m[0].replace(/[.,;)]+$/, ""));
        } else if (/^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}(\/.*)?$/.test(clean)) {
          list.push("https://" + clean);
        }
      }

      const deduped = [];
      const seen = new Set();
      for (const u of list) {
        try {
          const norm = new URL(u).toString();
          if (!seen.has(norm)) {
            seen.add(norm);
            deduped.push(norm);
          }
        } catch (_) {}
      }
      return deduped;
    }

    function buildPrioritizedPool(urls) {
      const shuffled = shuffleArray(urls || []);
      let cached = "";
      try {
        cached = localStorage.getItem(FAST_URL_CACHE_KEY) || "";
      } catch (_) {}
      if (cached && shuffled.includes(cached)) {
        return [cached, ...shuffled.filter((u) => u !== cached)];
      }
      return shuffled;
    }

    function probeHeadOrGet(url, timeoutMs = 2200) {
      return new Promise((resolve, reject) => {
        let settled = false;
        const finishOk = (val) => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          resolve(val);
        };
        const finishErr = (err) => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          reject(err);
        };

        const timer = setTimeout(() => finishErr(new Error("timeout")), timeoutMs);
        const t0 = performance.now();
        const sep = url.includes("?") ? "&" : "?";
        const probeTarget = `${url}${sep}_t=${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;

        const attempt = (method, subTimeoutMs) => {
          const ctrl = new AbortController();
          const subTimer = setTimeout(() => ctrl.abort(), subTimeoutMs);
          return fetch(probeTarget, {
            method,
            mode: "no-cors",
            cache: "no-store",
            signal: ctrl.signal
          }).then(() => {
            clearTimeout(subTimer);
            finishOk({
              url,
              method,
              duration: Math.round(performance.now() - t0)
            });
          }).catch((err) => {
            clearTimeout(subTimer);
            throw err;
          });
        };

        const headBudget = Math.max(500, Math.floor(timeoutMs * 0.55));
        const getBudget = Math.max(600, timeoutMs - headBudget - 100);
        attempt("HEAD", headBudget).catch(() => {
          attempt("GET", getBudget).catch(finishErr);
        });
      });
    }

    function raceToFirstSuccess(tasks) {
      return new Promise((resolve, reject) => {
        if (!Array.isArray(tasks) || !tasks.length) {
          reject(new Error("empty"));
          return;
        }
        let settled = false;
        let failCount = 0;

        tasks.forEach((task) => {
          Promise.resolve()
            .then(task)
            .then((res) => {
              if (!settled) {
                settled = true;
                resolve(res);
              }
            })
            .catch(() => {
              failCount++;
              if (!settled && failCount === tasks.length) {
                reject(new Error("all failed"));
              }
            });
        });
      });
    }

    async function probeFastestUrl(urls, timeoutMs = 2200) {
      const ordered = buildPrioritizedPool(urls);
      if (!ordered.length) return null;

      const firstBatch = ordered.slice(0, 4);
      try {
        return await raceToFirstSuccess(
          firstBatch.map((u) => () => probeHeadOrGet(u, timeoutMs))
        );
      } catch (_) {}

      const restBatch = ordered.slice(4);
      const secondBatch = restBatch.length ? restBatch : ordered;
      try {
        return await raceToFirstSuccess(
          secondBatch.map((u) => () => probeHeadOrGet(u, Math.max(timeoutMs + 1300, 3500)))
        );
      } catch (_) {
        return null;
      }
    }

    function parseVersionFromHtml(htmlText) {
      const m = String(htmlText || "").match(/const\s+TOOL_VERSION\s*=\s*["']([^"']+)["']/);
      return m ? m[1].trim() : "";
    }

    async function fetchTextWithTimeout(url, timeoutMs = 4500) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        fetchSeq += 1;
        const sep = url.includes("?") ? "&" : "?";
        const bust = `${Date.now()}_${fetchSeq}_${Math.random().toString(36).slice(2, 8)}`;
        const res = await fetch(`${url}${sep}_nocache=${bust}&_v=${bust}`, {
          signal: ctrl.signal,
          cache: "no-store",
          redirect: "follow"
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        return await res.text();
      } finally {
        clearTimeout(timer);
      }
    }

    function triggerHtmlDownload(htmlText, versionTag) {
      if (!htmlText) return false;
      const blob = new Blob([htmlText], { type: "text/html;charset=utf-8" });
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = blobUrl;
      a.download = `飞鱼磁力最新网址${versionTag ? "_v" + versionTag : ""}.html`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(blobUrl), 2500);
      return true;
    }

    async function fetchRemoteToolHtml() {
      for (const src of TOOL_SOURCES) {
        try {
          remoteHtmlSeq += 1;
          const sep = src.includes("?") ? "&" : "?";
          const bust = `${Date.now()}_${remoteHtmlSeq}_${Math.random().toString(36).slice(2, 10)}`;
          const liveUrl = `${src}${sep}_live_remote=${bust}&_r=${bust}`;
          const html = await fetchTextWithTimeout(liveUrl, 5000);
          if (html && html.includes("<html")) {
            return { html, version: parseVersionFromHtml(html), source: liveUrl };
          }
        } catch (_) {}
      }
      return null;
    }

    async function checkRemoteToolUpdate() {
      latestHtmlCache = "";
      latestRemoteVersion = "";

      const remote = await fetchRemoteToolHtml();
      if (!remote || !remote.version || remote.version === TOOL_VERSION) {
        hasPendingUpdate = false;
        updateBanner.classList.remove("show");
        return false;
      }

      latestHtmlCache = remote.html;
      latestRemoteVersion = remote.version;
      hasPendingUpdate = true;
      autoJumpChk.checked = false;
      clearScheduledJump();
      updateText.textContent = `检测到远端新版本 v${remote.version}（当前 v${TOOL_VERSION}），是否下载新版？`;
      updateBanner.classList.add("show");
      return true;
    }

    function applyResolvedUrl(picked, isFallback = false) {
      try {
        localStorage.setItem(FAST_URL_CACHE_KEY, picked.url);
      } catch (_) {}

      statusBox.className = "status ok";
      statusBox.textContent = isFallback
        ? `已切换至可用备用网址（约 ${picked.duration} ms）`
        : `已选出可用网址（约 ${picked.duration} ms）`;
      latestUrlInput.value = picked.url;
      openBtn.setAttribute("href", picked.url);

      clearScheduledJump();
      if (!hasPendingUpdate && autoJumpChk.checked) {
        jumpTimer = setTimeout(() => {
          window.location.href = picked.url;
        }, 800);
      }
    }

    async function resolveLatestUrl() {
      clearScheduledJump();
      statusBox.className = "status";
      statusBox.textContent = "正在测速…";
      latestUrlInput.value = "";
      openBtn.setAttribute("href", "#");

      for (const src of SOURCES) {
        try {
          const text = await fetchTextWithTimeout(src, 4500);
          const candidates = extractCandidateUrls(text);
          if (!candidates.length) continue;

          const picked = await probeFastestUrl(candidates, 2200);
          if (picked && picked.url) {
            applyResolvedUrl(picked, false);
            return;
          }
        } catch (_) {}
      }

      const fb = await probeFastestUrl(FALLBACK_URLS, 2200);
      if (fb && fb.url) {
        applyResolvedUrl(fb, true);
        return;
      }

      statusBox.className = "status err";
      statusBox.textContent = "所有候选网址均未通过测速，请点击下方备用入口或重新检测。";
    }

    async function runCheckAndResolve() {
      if (isRunning) return;
      isRunning = true;
      retryBtn.disabled = true;
      try {
        await checkRemoteToolUpdate();
        await resolveLatestUrl();
      } finally {
        isRunning = false;
        retryBtn.disabled = false;
      }
    }

    confirmUpdateBtn.addEventListener("click", async () => {
      confirmUpdateBtn.disabled = true;
      updateText.textContent = "正在直接从远端拉取最新文件…";

      const remote = await fetchRemoteToolHtml();
      const htmlToSave = remote && remote.html ? remote.html : latestHtmlCache;
      const verTag = (remote && remote.version) || latestRemoteVersion || "latest";

      if (triggerHtmlDownload(htmlToSave, verTag)) {
        updateText.textContent = `已下载最新版本 v${verTag}，请在浏览器下载列表中打开新文件。`;
      } else {
        updateText.textContent = "远端拉取失败，请稍后再试。";
      }
      confirmUpdateBtn.disabled = false;
    });

    dismissUpdateBtn.addEventListener("click", () => {
      updateBanner.classList.remove("show");
      hasPendingUpdate = false;
      latestHtmlCache = "";
      latestRemoteVersion = "";
    });

    autoJumpChk.addEventListener("change", () => {
      if (!autoJumpChk.checked) {
        clearScheduledJump();
      }
    });

    copyBtn.addEventListener("click", async () => {
      const val = latestUrlInput.value.trim();
      if (!val) return;
      try {
        await navigator.clipboard.writeText(val);
        copyBtn.textContent = "已复制";
      } catch (_) {
        latestUrlInput.select();
        document.execCommand("copy");
        copyBtn.textContent = "已复制";
      }
      setTimeout(() => { copyBtn.textContent = "复制"; }, 1500);
    });

    retryBtn.addEventListener("click", runCheckAndResolve);

    renderMirrors();
    runCheckAndResolve();
  </script>
</body>
</html>
